<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { hovered: null, isDesktop: true, stageScale: 1, view: 'landing', anim: null, mapSrc: 'Minciu_zemelapis.html#pavyzdys' };

  NODES = [
    { key: 'how', c: '110,230,50', nx: 947.2, ny: 206.4, ph: 0 },
    { key: 'saved', c: '63,232,255', nx: 896, ny: 662.2, ph: 0.25 },
    { key: 'blog', c: '255,150,50', nx: 320, ny: 258, ph: 0.5 },
    { key: 'about', c: '160,110,255', nx: 371.2, ny: 619.2, ph: 0.75 }
  ];

  updateScale = () => {
    const s = Math.min((window.innerWidth - 32) / 1280, (window.innerHeight - 24) / 860, 1);
    if (Math.abs(s - this.state.stageScale) > 0.005) this.setState({ stageScale: s });
  };

  setCanvas = (el) => { if (el && el !== this.canvas) { this.canvas = el; this.initCanvas(); } };
  setLineCanvas = (el) => {
    if (el && el !== this.lcanvas) {
      this.lcanvas = el;
      const dpr = Math.min(window.devicePixelRatio || 1, 1.75);
      el.width = 1280 * dpr; el.height = 860 * dpr;
      this.ldpr = dpr;
    }
  };

  openCreate = (e) => {
    if (e) e.preventDefault();
    this.setState({ mapSrc: 'Minciu_zemelapis.html#naujas' });
    this.openMap();
  };

  openMap = (e) => {
    if (e) { e.preventDefault(); this.setState({ mapSrc: 'Minciu_zemelapis.html#pavyzdys' }); }
    this.setState({ anim: 'toMap', hovered: null });
    clearTimeout(this.morphTimer);
    this.morphTimer = setTimeout(() => this.setState({ view: 'map', anim: null }), 750);
  };

  closeMap = () => {
    this.setState({ anim: 'toLanding' });
    clearTimeout(this.morphTimer);
    this.morphTimer = setTimeout(() => this.setState({ view: 'landing', anim: null }), 700);
  };

  componentDidMount() {
    this.mq = window.matchMedia('(min-width: 820px)');
    this.reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
    this.onMq = () => { this.setState({ isDesktop: this.mq.matches }); this.generate(); };
    this.mq.addEventListener('change', this.onMq);
    this.setState({ isDesktop: this.mq.matches });
    this.onMove = (e) => {
      this.px = e.clientX; this.py = e.clientY;
      if (!this.mq.matches || this.reduced.matches || this.state.view === 'map') return;
      const s = Number(this.props.parallaxStrength ?? 26);
      const w = window.innerWidth, h = window.innerHeight;
      this.tx = -((e.clientX - w / 2) / (w / 2)) * s;
      this.ty = -((e.clientY - h / 2) / (h / 2)) * s;
    };
    this.onTouch = (e) => { if (e.touches && e.touches.length) { this.px = e.touches[0].clientX; this.py = e.touches[0].clientY; } };
    this.onTouchEnd = () => { this.px = -9999; this.py = -9999; };
    this.onResize = () => { this.generate(); this.updateScale(); };
    this.onMsg = (e) => {
      if (!e.data) return;
      if (e.data.type === 'mmBack') { try { e.source && e.source.postMessage({ type: 'mmBackAck' }, '*'); } catch (_) {} this.closeMap(); }
      else if (e.data.type === 'mmOpenSaved') { location.href = 'Saved-Maps.dc.html'; }
    };
    window.addEventListener('mousemove', this.onMove);
    window.addEventListener('touchstart', this.onTouch, { passive: true });
    window.addEventListener('touchmove', this.onTouch, { passive: true });
    window.addEventListener('touchend', this.onTouchEnd);
    window.addEventListener('resize', this.onResize);
    window.addEventListener('message', this.onMsg);
    this.updateScale();
    this.initCanvas();
  }

  componentWillUnmount() {
    window.removeEventListener('mousemove', this.onMove);
    window.removeEventListener('touchstart', this.onTouch);
    window.removeEventListener('touchmove', this.onTouch);
    window.removeEventListener('touchend', this.onTouchEnd);
    window.removeEventListener('resize', this.onResize);
    window.removeEventListener('message', this.onMsg);
    this.mq && this.mq.removeEventListener('change', this.onMq);
    cancelAnimationFrame(this.raf);
    clearTimeout(this.morphTimer);
  }

  componentDidUpdate(prevProps) {
    if (prevProps.patternDensity !== this.props.patternDensity || prevProps.showPattern !== this.props.showPattern) this.generate();
  }

  initCanvas() {
    if (!this.canvas || this.started) return;
    this.started = true;
    this.tx = 0; this.ty = 0; this.ox = 0; this.oy = 0;
    this.px = -9999; this.py = -9999; this.bgFade = 1;
    this.makeSprites();
    this.generate();
    const loop = (time) => {
      this.ox += (this.tx - this.ox) * 0.045;
      this.oy += (this.ty - this.oy) * 0.045;
      const mapish = this.state.view === 'map' || this.state.anim === 'toMap';
      this.bgFade += ((mapish ? 0.45 : 1) - this.bgFade) * 0.04;
      this.draw();
      this.drawLines(time || 0);
      this.raf = requestAnimationFrame(loop);
    };
    loop(0);
  }

  makeSprites() {
    this.sprites = {};
    for (let hue = 180; hue <= 315; hue += 15) {
      const c = document.createElement('canvas');
      c.width = 96; c.height = 96;
      const ctx = c.getContext('2d');
      const g = ctx.createRadialGradient(48, 48, 0, 48, 48, 48);
      g.addColorStop(0, `hsla(${hue}, 100%, 82%, 0.85)`);
      g.addColorStop(0.22, `hsla(${hue}, 95%, 62%, 0.32)`);
      g.addColorStop(0.55, `hsla(${hue}, 90%, 50%, 0.10)`);
      g.addColorStop(1, 'hsla(0, 0%, 0%, 0)');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 96, 96);
      this.sprites[hue] = c;
    }
  }

  spriteFor(hue) {
    const b = Math.max(180, Math.min(315, Math.round(hue / 15) * 15));
    return this.sprites[b];
  }

  generate() {
    if (!this.canvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 1.75);
    const w = window.innerWidth, h = window.innerHeight;
    this.canvas.width = w * dpr; this.canvas.height = h * dpr;
    this.w = w; this.h = h; this.dpr = dpr;
    const density = Number(this.props.patternDensity ?? 3.4);
    const mobileFactor = (this.mq && this.mq.matches) ? 1 : 0.55;
    const count = Math.min(1200, Math.round((w * h) / 9500 * density * mobileFactor));
    this.pts = [];
    let attempts = 0;
    while (this.pts.length < count && attempts < count * 25) {
      attempts++;
      const x = Math.random() * (w + 120) - 60, y = Math.random() * (h + 120) - 60;
      const nd = Math.min(1, Math.hypot((x - w / 2) / (w * 0.5), (y - h / 2) / (h * 0.5)));
      if (Math.random() > 0.10 + 0.90 * Math.pow(nd, 1.6)) continue;
      const ang = Math.random() * Math.PI * 2, sp = 0.05 + Math.random() * 0.14;
      const z = 0.35 + Math.random() * 0.65;
      this.pts.push({
        x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, z,
        r: (0.7 + Math.random() * 1.5) * z,
        hue: 195 + 105 * (0.5 + 0.5 * Math.sin(x * 0.0021 + y * 0.0014)) + (Math.random() * 24 - 12),
        g: 0, ax: 0, ay: 0
      });
    }
    this.bokeh = [];
    for (let i = 0; i < 16; i++) {
      const ang = Math.random() * Math.PI * 2;
      this.bokeh.push({
        x: Math.random() * w, y: Math.random() * h,
        r: 14 + Math.random() * 46,
        hue: 200 + Math.random() * 90,
        a: 0.025 + Math.random() * 0.045,
        vx: Math.cos(ang) * 0.03, vy: Math.sin(ang) * 0.03
      });
    }
    this.maxDist = Math.max(60, Math.min(130, Math.sqrt((w * h) / Math.max(count, 1)) * 1.5));
  }

  drawLines(time) {
    if (!this.lcanvas || !this.lcanvas.isConnected) return;
    const ctx = this.lcanvas.getContext('2d');
    ctx.setTransform(this.ldpr, 0, 0, this.ldpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, 1280, 860);
    const hov = this.state.hovered;
    const cx = 640, cy = 430, hubR = 152, nodeR = 94;
    ctx.lineCap = 'round';
    for (const n of this.NODES) {
      const f = hov ? (hov === n.key ? 1.7 : 0.3) : 1;
      const dx = n.nx - cx, dy = n.ny - cy, len = Math.hypot(dx, dy);
      const ux = dx / len, uy = dy / len;
      const x1 = cx + ux * hubR, y1 = cy + uy * hubR;
      const x2 = n.nx - ux * nodeR, y2 = n.ny - uy * nodeR;
      ctx.strokeStyle = `rgba(${n.c}, ${0.10 * f})`;
      ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.strokeStyle = `rgba(${n.c}, ${0.34 * f})`;
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      ctx.strokeStyle = `rgba(255,255,255, ${0.20 * f})`;
      ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      if (!(this.reduced && this.reduced.matches)) {
        ctx.globalCompositeOperation = 'lighter';
        for (let i = 0; i < 2; i++) {
          const t = ((time / 2400) + n.ph + i * 0.5) % 1;
          const px = x1 + (x2 - x1) * t, py = y1 + (y2 - y1) * t;
          const a = Math.sin(Math.PI * t) * Math.min(f, 1.25);
          ctx.beginPath(); ctx.arc(px, py, 7, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${n.c}, ${a * 0.22})`; ctx.fill();
          ctx.beginPath(); ctx.arc(px, py, 2.4, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255, ${a * 0.9})`; ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';
      }
    }
  }

  draw() {
    if (!this.canvas || !this.pts) return;
    const ctx = this.canvas.getContext('2d');
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, this.w, this.h);
    if (this.props.showPattern === false) return;
    if (this.state.view === 'map') return; // iframe covers the screen; save the work
    const w = this.w, h = this.h;
    const R = Number(this.props.glowRadius ?? 200);
    const fade = this.bgFade;
    const still = this.reduced && this.reduced.matches;
    for (const p of this.pts) {
      if (!still) {
        p.x += p.vx * p.z; p.y += p.vy * p.z;
        if (p.x < -60) p.x = w + 60; else if (p.x > w + 60) p.x = -60;
        if (p.y < -60) p.y = h + 60; else if (p.y > h + 60) p.y = -60;
      }
      const bx = p.x + this.ox * p.z, by = p.y + this.oy * p.z;
      const dist = Math.hypot(bx - this.px, by - this.py);
      let t = 0;
      if (dist < R) { const u = 1 - dist / R; t = u * u * (3 - 2 * u); }
      p.g += (t - p.g) * (t > p.g ? 0.20 : 0.05);
      if (p.g < 0.004) p.g = 0;
      const pull = Math.min(t * 0.16, 0.16);
      p.ax += ((this.px - bx) * pull - p.ax) * 0.10;
      p.ay += ((this.py - by) * pull - p.ay) * 0.10;
      p._x = bx + p.ax; p._y = by + p.ay;
      p._cf = (0.25 + 0.75 * Math.min(1, Math.hypot(p._x - w / 2, p._y - h / 2) / (0.52 * Math.min(w, h)))) * fade;
    }
    ctx.globalCompositeOperation = 'lighter';
    for (const b of this.bokeh) {
      if (!still) {
        b.x += b.vx; b.y += b.vy;
        if (b.x < -80) b.x = w + 80; else if (b.x > w + 80) b.x = -80;
        if (b.y < -80) b.y = h + 80; else if (b.y > h + 80) b.y = -80;
      }
      const s = this.spriteFor(b.hue);
      ctx.globalAlpha = b.a * fade;
      ctx.drawImage(s, b.x - b.r, b.y - b.r, b.r * 2, b.r * 2);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    const cell = this.maxDist, cols = Math.ceil((w + 160) / cell), grid = new Map();
    for (let i = 0; i < this.pts.length; i++) {
      const p = this.pts[i];
      const k = Math.floor((p._x + 80) / cell) + Math.floor((p._y + 80) / cell) * cols;
      const arr = grid.get(k); if (arr) arr.push(p); else grid.set(k, [p]);
    }
    const md2 = this.maxDist * this.maxDist;
    ctx.lineCap = 'round';
    for (const p of this.pts) {
      const gx0 = Math.floor((p._x + 80) / cell), gy0 = Math.floor((p._y + 80) / cell);
      for (let gx = gx0; gx <= gx0 + 1; gx++) for (let gy = gy0 - 1; gy <= gy0 + 1; gy++) {
        if (gx === gx0 && gy < gy0) continue;
        const bucket = grid.get(gx + gy * cols); if (!bucket) continue;
        for (const q of bucket) {
          if (q === p || (gx === gx0 && gy === gy0 && q.x <= p.x)) continue;
          const dx = p._x - q._x, dy = p._y - q._y, d2 = dx * dx + dy * dy;
          if (d2 >= md2) continue;
          const near = 1 - Math.sqrt(d2) / this.maxDist;
          const glow = (p.g + q.g) / 2;
          const zz = (p.z + q.z) / 2;
          const alpha = (near * (0.055 + zz * 0.075) + glow * 0.30) * (p._cf + q._cf) / 2;
          if (alpha < 0.015) continue;
          ctx.strokeStyle = `hsla(${(p.hue + q.hue) / 2}, 85%, ${58 + glow * 18}%, ${alpha})`;
          ctx.lineWidth = 0.5 + zz * 0.4 + glow * 1.1;
          ctx.beginPath(); ctx.moveTo(p._x, p._y); ctx.lineTo(q._x, q._y); ctx.stroke();
        }
      }
    }
    ctx.globalCompositeOperation = 'lighter';
    for (const p of this.pts) {
      const s = this.spriteFor(p.hue);
      const halo = p.r * (5 + p.g * 5.5) + 3;
      ctx.globalAlpha = (0.35 + p.z * 0.45 + p.g * 0.25) * p._cf;
      ctx.drawImage(s, p._x - halo, p._y - halo, halo * 2, halo * 2);
      ctx.globalAlpha = 1;
      ctx.beginPath();
      ctx.arc(p._x, p._y, p.r * (1 + p.g * 0.6), 0, Math.PI * 2);
      ctx.fillStyle = `hsla(${p.hue}, 100%, ${80 + p.g * 15}%, ${(0.55 + p.z * 0.35 + p.g * 0.1) * p._cf})`;
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
  }

  renderVals() {
    const h = this.state.hovered;
    const { view, anim } = this.state;
    const morphOut = anim === 'toMap';
    const mk = (key, fill, glowRgb) => ({
      bg: h === key ? fill : '#10161F',
      t: morphOut ? 'scale(0.7)' : (h === key ? 'scale(1.08)' : 'scale(1)'),
      o: morphOut ? 0 : (h && h !== key ? 0.30 : 1),
      sh: h === key ? `0 0 60px rgba(${glowRgb},0.60), 0 0 22px rgba(${glowRgb},0.40)` : `0 0 26px rgba(${glowRgb},0.22)`
    });
    return {
      landingDesktop: this.state.isDesktop && (view === 'landing' || anim === 'toLanding'),
      landingMobile: !this.state.isDesktop && (view === 'landing' || anim === 'toLanding'),
      showMap: view === 'map' || anim === 'toMap',
      mapO: anim === 'toLanding' ? 0 : 1,
      mapT: anim === 'toLanding' ? 'scale(0.9)' : 'scale(1)',
      stageScale: this.state.stageScale,
      setCanvas: this.setCanvas,
      setLineCanvas: this.setLineCanvas,
      openMap: this.openMap,
      openCreate: this.openCreate,
      mapSrc: this.state.mapSrc,
      chromeO: morphOut ? 0 : 1,
      lineO: morphOut ? 0 : 1,
      stageAnim: anim === 'toLanding' ? 'stageIn 0.6s cubic-bezier(0.22,1,0.36,1) 0.15s backwards' : 'none',
      how: mk('how', '#4CB812', '110,230,50'),
      saved: mk('saved', '#0FA5BC', '63,232,255'),
      blog: mk('blog', '#EA6A0E', '255,150,50'),
      about: mk('about', '#7E4FE8', '160,110,255'),
      center: {
        t: morphOut ? 'scale(2.35)' : (h === 'center' ? 'scale(1.04)' : 'scale(1)'),
        o: morphOut ? 0 : (h && h !== 'center' ? 0.45 : 1),
        anim: morphOut ? 'none' : (h === 'center' ? 'none' : 'hubBreath 5s ease-in-out infinite'),
        trans: morphOut ? 'transform 0.7s cubic-bezier(0.4,0,0.2,1), opacity 0.5s ease 0.12s' : 'transform 0.4s cubic-bezier(0.22,1,0.36,1), opacity 0.35s ease, box-shadow 0.4s ease',
        sh: h === 'center'
          ? '0 0 140px rgba(47,216,255,0.60), 0 0 50px rgba(47,216,255,0.50), inset 0 0 90px rgba(47,216,255,0.32)'
          : '0 0 100px rgba(47,216,255,0.42), 0 0 36px rgba(47,216,255,0.36), inset 0 0 70px rgba(47,216,255,0.24)'
      },
      enterHow: () => this.setState({ hovered: 'how' }),
      enterSaved: () => this.setState({ hovered: 'saved' }),
      enterBlog: () => this.setState({ hovered: 'blog' }),
      enterAbout: () => this.setState({ hovered: 'about' }),
      enterCenter: () => this.setState({ hovered: 'center' }),
      leave: () => this.setState({ hovered: null })
    };
  }
}
</script>
</body>
</html>
