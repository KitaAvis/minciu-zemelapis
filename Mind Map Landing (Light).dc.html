<script type="text/x-dc" data-dc-script data-props="{&quot;parallaxStrength&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:26,&quot;min&quot;:0,&quot;max&quot;:200,&quot;step&quot;:2,&quot;unit&quot;:&quot;px&quot;,&quot;section&quot;:&quot;Background&quot;},&quot;patternDensity&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:1,&quot;min&quot;:0.4,&quot;max&quot;:10,&quot;step&quot;:0.2,&quot;section&quot;:&quot;Background&quot;},&quot;showPattern&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;section&quot;:&quot;Background&quot;},&quot;glowRadius&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:200,&quot;min&quot;:80,&quot;max&quot;:400,&quot;step&quot;:10,&quot;unit&quot;:&quot;px&quot;,&quot;section&quot;:&quot;Glow&quot;}}">
class Component extends DCLogic {
  state = { hovered: null, isDesktop: true, stageScale: 1 };

  updateScale = () => {
    const s = Math.min((window.innerWidth - 32) / 1280, (window.innerHeight - 24) / 860, 1);
    if (Math.abs(s - this.state.stageScale) > 0.005) this.setState({ stageScale: s });
  };

  setCanvas = (el) => {
    if (el && el !== this.canvas) { this.canvas = el; this.initCanvas(); }
  };

  componentDidMount() {
    this.mq = window.matchMedia('(min-width: 820px)');
    this.reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
    this.onMq = () => this.setState({ isDesktop: this.mq.matches });
    this.mq.addEventListener('change', this.onMq);
    this.onMq();
    this.onMove = (e) => {
      this.setPointer(e.clientX, e.clientY);
      if (!this.mq.matches || this.reduced.matches) return;
      const s = Number(this.props.parallaxStrength ?? 26);
      const w = window.innerWidth, h = window.innerHeight;
      this.tx = -((e.clientX - w / 2) / (w / 2)) * s;
      this.ty = -((e.clientY - h / 2) / (h / 2)) * s;
    };
    this.onTouch = (e) => {
      if (e.touches && e.touches.length) this.setPointer(e.touches[0].clientX, e.touches[0].clientY);
    };
    this.onResize = () => { this.generate(); this.updateScale(); };
    this.updateScale();
    window.addEventListener('mousemove', this.onMove);
    window.addEventListener('touchstart', this.onTouch, { passive: true });
    window.addEventListener('touchmove', this.onTouch, { passive: true });
    window.addEventListener('resize', this.onResize);
    this.initCanvas();
  }

  setPointer(x, y) {
    if (this.px !== undefined) {
      // advance hue with pointer travel for a gentle spectrum shift
      this.hue = (this.hue + Math.min(Math.hypot(x - this.px, y - this.py) * 0.08, 4)) % 360;
    }
    this.px = x; this.py = y;
  }

  componentWillUnmount() {
    window.removeEventListener('mousemove', this.onMove);
    window.removeEventListener('touchstart', this.onTouch);
    window.removeEventListener('touchmove', this.onTouch);
    window.removeEventListener('resize', this.onResize);
    this.mq && this.mq.removeEventListener('change', this.onMq);
    cancelAnimationFrame(this.raf);
  }

  componentDidUpdate(prevProps) {
    if (prevProps.patternDensity !== this.props.patternDensity || prevProps.showPattern !== this.props.showPattern) this.generate();
  }

  initCanvas() {
    if (!this.canvas || this.started) return;
    this.started = true;
    this.tx = 0; this.ty = 0; this.ox = 0; this.oy = 0;
    this.px = -9999; this.py = -9999; this.hue = 190;
    this.generate();
    const loop = () => {
      this.ox += (this.tx - this.ox) * 0.045;
      this.oy += (this.ty - this.oy) * 0.045;
      this.hue = (this.hue + 0.12) % 360; // slow ambient cycle
      this.draw();
      this.raf = requestAnimationFrame(loop);
    };
    loop();
  }

  generate() {
    if (!this.canvas) return;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = window.innerWidth, h = window.innerHeight;
    this.canvas.width = w * dpr; this.canvas.height = h * dpr;
    this.w = w; this.h = h; this.dpr = dpr;
    const density = Number(this.props.patternDensity ?? 1);
    const count = Math.round((w * h) / 8500 * density);
    // jittered grid for even full-viewport coverage (no bare corners)
    const cols = Math.ceil(Math.sqrt(count * w / h));
    const rows = Math.ceil(count / cols);
    const cw = (w + 80) / cols, ch = (h + 80) / rows;
    this.pts = [];
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      if (this.pts.length >= count) break;
      this.pts.push({
        x: -40 + c * cw + (0.15 + Math.random() * 0.7) * cw,
        y: -40 + r * ch + (0.15 + Math.random() * 0.7) * ch,
        r: 1 + Math.random() * 1.7,
        d: 0.45 + Math.random() * 0.55,
        g: 0
      });
    }
    this.edges = [];
    const max = Math.min(120, Math.sqrt((w * h) / count) * 1.5);
    for (let i = 0; i < this.pts.length; i++) for (let j = i + 1; j < this.pts.length; j++) {
      const a = this.pts[i], b = this.pts[j];
      const dx = a.x - b.x, dy = a.y - b.y;
      if (dx * dx + dy * dy < max * max) this.edges.push([a, b]);
    }
  }

  draw() {
    if (!this.canvas || !this.pts) return;
    const ctx = this.canvas.getContext('2d');
    ctx.setTransform(this.dpr, 0, 0, this.dpr, 0, 0);
    ctx.clearRect(0, 0, this.w, this.h);
    if (this.props.showPattern === false) return;
    const R = Number(this.props.glowRadius ?? 200);
    const hue = this.hue;
    // per-point glow: fast attack, slow decay = trailing wake
    for (const p of this.pts) {
      const x = p.x + this.ox * p.d, y = p.y + this.oy * p.d;
      const dist = Math.hypot(x - this.px, y - this.py);
      let target = 0;
      if (dist < R) { const t = 1 - dist / R; target = t * t * (3 - 2 * t); } // smoothstep falloff
      p.g += (target - p.g) * (target > p.g ? 0.22 : 0.045);
      if (p.g < 0.004) p.g = 0;
      p._x = x; p._y = y;
    }
    // base grey lines
    ctx.lineWidth = 1;
    ctx.strokeStyle = 'rgba(60,62,65,0.07)';
    ctx.beginPath();
    for (const [a, b] of this.edges) { ctx.moveTo(a._x, a._y); ctx.lineTo(b._x, b._y); }
    ctx.stroke();
    // glowing lines
    ctx.lineCap = 'round';
    for (const [a, b] of this.edges) {
      const g = (a.g + b.g) / 2;
      if (g < 0.02) continue;
      ctx.lineWidth = 1 + g * 0.9;
      ctx.strokeStyle = `hsla(${hue}, 75%, 52%, ${g * 0.55})`;
      ctx.beginPath(); ctx.moveTo(a._x, a._y); ctx.lineTo(b._x, b._y); ctx.stroke();
    }
    // points: grey base + glow overlay, slight scale-up
    for (const p of this.pts) {
      const rad = p.r * (1 + p.g * 0.45);
      ctx.beginPath();
      ctx.arc(p._x, p._y, rad, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(60,62,65,0.15)';
      ctx.fill();
      if (p.g > 0.02) {
        ctx.beginPath();
        ctx.arc(p._x, p._y, rad, 0, Math.PI * 2);
        ctx.fillStyle = `hsla(${hue}, 78%, 50%, ${p.g * 0.85})`;
        ctx.fill();
      }
    }
  }

  renderVals() {
    const h = this.state.hovered;
    const mk = (key, dark, dx, dy) => ({
      t: h === key ? 'scale(1.08)' : 'scale(1)',
      o: h && h !== key ? 0.35 : 1,
      sh: h === key ? '0 20px 48px rgba(0,0,0,0.24)' : '0 6px 18px rgba(0,0,0,0.10)',
      lw: h === key ? 3 : 2,
      lo: h ? (h === key ? 1 : 0.25) : 0.85,
      ls: h === key ? dark : '#c8c8c4',
      st: h === key ? `translate(${dx}px, ${dy}px)` : 'translate(0px, 0px)'
    });
    return {
      isDesktop: this.state.isDesktop,
      isMobile: !this.state.isDesktop,
      stageScale: this.state.stageScale,
      setCanvas: this.setCanvas,
      how: mk('how', '#5f9418', -8, 9),
      saved: mk('saved', '#15818d', -9, -9),
      blog: mk('blog', '#c96f0e', 9, 10),
      about: mk('about', '#6243a3', 9, -9),
      sub: mk('sub', '#b52f5e', -6, 10),
      ex: mk('ex', '#2a55b8', 6, -10),
      center: {
        t: h === 'center' ? 'scale(1.04)' : 'scale(1)',
        o: h && h !== 'center' ? 0.45 : 1,
        anim: h === 'center' ? 'hubPulse 1.7s ease-out infinite' : 'none'
      },
      enterHow: () => this.setState({ hovered: 'how' }),
      enterSaved: () => this.setState({ hovered: 'saved' }),
      enterBlog: () => this.setState({ hovered: 'blog' }),
      enterAbout: () => this.setState({ hovered: 'about' }),
      enterSub: () => this.setState({ hovered: 'sub' }),
      enterEx: () => this.setState({ hovered: 'ex' }),
      enterCenter: () => this.setState({ hovered: 'center' }),
      leave: () => this.setState({ hovered: null })
    };
  }
}
</script>
</body>
</html>
